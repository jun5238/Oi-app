<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - B2B 마케팅</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; background: #f4f6f8; padding-bottom: 90px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .container { padding: 20px; }
    .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 15px; display: flex; align-items: center; }
    .card-title span { margin-right: 5px; }
    .huge-number { font-size: 36px; font-weight: bold; color: #d32f2f; margin-bottom: 5px; }
    .compare { font-size: 13px; font-weight: bold; color: #d32f2f; margin-bottom: 15px; }
    .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { width: 85%; height: 100%; background: #d32f2f; border-radius: 5px; }
    .btn-dark { width: 100%; padding: 15px; background: #1a237e; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .list-item:last-child { border-bottom: none; }
    .rank { font-weight: bold; font-size: 16px; margin-right: 10px; }
    .brand { font-size: 16px; font-weight: bold; flex: 1; }
    .count { color: #d32f2f; font-weight: bold; font-size: 15px; }
    
    .blue-card { background: #e3f2fd; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
    .blue-card-title { font-size: 14px; font-weight: bold; color: #1565c0; margin-bottom: 10px; display: flex; align-items: center; }
    .blue-card-desc { font-size: 14px; color: #333; line-height: 1.5; margin-bottom: 15px; }
    .btn-blue { width: 100%; padding: 15px; background: #1976d2; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }

    .bottom-nav { width: 100%; display: flex; background: #fff; padding: 12px 0; border-top: 1px solid #eee; position: fixed; bottom: 0; left: 0; z-index: 9999; height: 75px; box-sizing: border-box; }
    .nav-item { flex: 1; text-align: center; font-size: 11px; color: #aaa; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .nav-active { color: #333; }
    .nav-icon { font-size: 24px; margin-bottom: 5px; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-title"><span>🔥</span> 풍기동 입점 수요 실시간 화력</div>
      <div class="huge-number">9,876명</div>
      <div class="compare">지난주 대비 ▲ 12% 상승</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
      <button class="btn-dark" onclick="myAlert('데이터 구매 페이지로 이동합니다!')">실시간 입점 수요 데이터 구매하기 💸</button>
    </div>

    <div class="card">
      <div class="card-title"><span>📊</span> 풍기동 브랜드 선호도 TOP 3</div>
      <div class="list-item">
        <span class="rank">1.</span><span class="brand">☕ 컴포즈커피</span><span class="count">4,210명 심음</span>
      </div>
      <div class="list-item">
        <span class="rank">2.</span><span class="brand">💄 올리브영</span><span class="count">3,150명 심음</span>
      </div>
      <div class="list-item">
        <span class="rank">3.</span><span class="brand">🌯 서브웨이</span><span class="count">2,516명 심음</span>
      </div>
    </div>

    <div class="blue-card">
      <div class="blue-card-title"><span>📢</span> 타겟 마케팅</div>
      <div class="blue-card-desc">풍기동에서 씨앗을 심은 9,876명에게<br><b>입점 확정 쿠폰</b>을 즉시 발송하시겠습니까?</div>
      <button class="btn-blue" onclick="myAlert('9,876명에게 쿠폰이 발송되었습니다!')">전용 쿠폰 발송하기 💌</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">🏠</span>홈</div>
    <div class="nav-item" onclick="myAlert('커뮤니티 준비 중!')"><span class="nav-icon">🏘️</span>커뮤니티</div>
    <div class="nav-item" onclick="location.href='map.html'"><span class="nav-icon">📍</span>동네지도</div>
    <div class="nav-item" onclick="myAlert('채팅창 준비 중!')"><span class="nav-icon">💬</span>채팅</div>
    <div class="nav-item nav-active" onclick="location.href='b2b.html'"><span class="nav-icon">👤</span>마이</div>
  </div>

  <script>
    function myAlert(msg) { alert(msg); }
  </script>
</body>
</html>
