<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - 동네 설정</title>
  <style>
    * { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none !important; }
    body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; background: #fff; padding-bottom: 75px; }
    .header { padding: 20px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #eee; position: relative; }
    .back-btn { position: absolute; left: 20px; top: 20px; font-size: 20px; cursor: pointer; pointer-events: auto; }
    .container { padding: 30px 20px; text-align: center; }
    .title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #111; }
    .desc { font-size: 15px; color: #777; margin-bottom: 40px; }
    .search-box { display: flex; align-items: center; background: #f4f6f8; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
    .search-box input { flex: 1; border: none; background: transparent; font-size: 16px; pointer-events: auto; }
    .search-icon { font-size: 20px; color: #aaa; margin-right: 10px; }
    .btn-location { width: 100%; padding: 18px; background: #e8f5e9; color: #4caf50; border: 1px solid #4caf50; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; pointer-events: auto; margin-bottom: 30px; }
    .region-list { text-align: left; }
    .region-item { padding: 15px 0; border-bottom: 1px solid #eee; font-size: 16px; font-weight: bold; color: #333; cursor: pointer; pointer-events: auto; display: flex; justify-content: space-between; align-items: center; }
    .bottom-nav { width: 100%; display: flex; background: #fff; padding: 0; border-top: 1px solid #eee; position: fixed; bottom: 0; left: 0; z-index: 9999; height: 75px; box-sizing: border-box; }
    .nav-item { flex: 1; text-align: center; color: #aaa; font-weight: bold; text-decoration: none; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; height: 100%; pointer-events: auto; }
    .nav-active { color: #333; }
    .nav-icon { font-size: 24px; line-height: 1.2; }
    .nav-text { font-size: 11px; margin-top: 4px; pointer-events: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="back-btn" onclick="location.href='index.html'">←</span>
    동네 설정
  </div>
  <div class="container">
    <div class="title">어디에 오이를 심을까요? 🥒</div>
    <div class="desc">씨앗을 심을 우리 동네를 선택해주세요!</div>
    
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="동명(읍, 면)으로 검색 (예: 풍기동)">
    </div>
    
    <button class="btn-location" onclick="setRegion()">📍 현재 위치로 동네 찾기</button>
    
    <div class="region-list">
      <div class="region-item" onclick="setRegion()">충청남도 아산시 풍기동 <span>선택</span></div>
      <div class="region-item" onclick="setRegion()">충청남도 아산시 모종동 <span>선택</span></div>
      <div class="region-item" onclick="setRegion()">충청남도 아산시 온양동 <span>선택</span></div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='home.html'"><span class="nav-icon">🏠</span><span class="nav-text">홈</span></div>
    <div class="nav-item" onclick="myAlert('커뮤니티 준비 중!')"><span class="nav-icon">🏘️</span><span class="nav-text">커뮤니티</span></div>
    <div class="nav-item" onclick="location.href='map.html'"><span class="nav-icon">📍</span><span class="nav-text">동네지도</span></div>
    <div class="nav-item" onclick="myAlert('채팅창 준비 중!')"><span class="nav-icon">💬</span><span class="nav-text">채팅</span></div>
    <div class="nav-item" onclick="location.href='b2b.html'"><span class="nav-icon">👤</span><span class="nav-text">마이</span></div>
  </div>

  <script>
    function myAlert(msg) { alert(msg); }
    function setRegion() {
      myAlert('🥒 풍기동으로 동네가 설정되었습니다!\n\n홈 화면으로 이동합니다!');
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
