<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오이(Oi) - 메인 오이밭(동별)</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f6f9; font-family: 'Malgun Gothic', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: #fff; padding: 15px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    .map-container { flex: 1; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; background: #fff; position: relative; }
    
    .dong-area { border-radius: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; color: rgba(0,0,0,0.4); position: relative; box-shadow: inset 0 0 20px rgba(255,255,255,0.5); }
    
    .dong-oncheon { background-color: #bbdefb; }
    .dong-mojong { background-color: #ffe0b2; }
    .dong-yonghwa { background-color: #e1bee7; }
    .dong-punggi { background-color: #c8e6c9; border: 5px solid #4caf50; color: #2e7d32; box-shadow: 0 10px 20px rgba(76,175,80,0.2); }
    
    .dong-title { margin-bottom: 10px; }
    
    .seed-marker { font-size: 28px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2)); cursor: pointer; margin: 5px; }
    
    .active-pin { font-size: 45px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); position: absolute; z-index: 5; animation: bounce 1s infinite alternate; }
    
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
    
    .plant-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 350px; padding: 18px; border-radius: 30px; font-weight: bold; font-size: 18px; border: none; background: #4caf50; color: #fff; cursor: pointer; box-shadow: 0 8px 15px rgba(76,175,80,0.4); z-index: 10; }
    
    .bottom-nav { width: 100%; display: flex; background: #fff; padding: 10px 0; border-top: 1px solid #eee; z-index: 20; padding-bottom: 20px; }
    .nav-item { flex: 1; text-align: center; font-size: 12px; color: #aaa; font-weight: bold; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
    .nav-active { color: #4caf50; }
    .nav-icon { font-size: 24px; }
  </style>
  <script>
    function myAlert(msg) {
      alert(msg);
    }
    
    function plantSeed() {
      myAlert('🌱 현재 위치(풍기동)에 씨앗을 심습니다!\n\n(곧 4번 브랜드 선택 팝업창으로 연결됩니다!)');
    }
    
    function showSeedInfo(brand) {
      myAlert('💦 [' + brand + '] 씨앗입니다!\n\n(곧 5번 물주기 진화 창으로 이동합니다!)');
    }
  </script>
</head>
<body>
  <div class="header">
    <span>📍 아산시 풍기동</span>
    <span style="font-size: 20px;" onclick="myAlert('검색 및 알림 기능 준비 중!')">🔍 🔔</span>
  </div>
  
  <div class="map-container">
    <div class="dong-area dong-oncheon" onclick="myAlert('온천동 구역입니다!')">
      <div class="dong-title">온천동</div>
      <div><span class="seed-marker" onclick="event.stopPropagation(); showSeedInfo('메가커피')">☕</span></div>
    </div>
    
    <div class="dong-area dong-mojong" onclick="myAlert('모종동 구역입니다!')">
      <div class="dong-title">모종동</div>
    </div>
    
    <div class="dong-area dong-yonghwa" onclick="myAlert('용화동 구역입니다!')">
      <div class="dong-title">용화동</div>
      <div>
        <span class="seed-marker" onclick="event.stopPropagation(); showSeedInfo('서브웨이')">🌯</span>
        <span class="seed-marker" onclick="event.stopPropagation(); showSeedInfo('올리브영')">💄</span>
      </div>
    </div>
    
    <div class="dong-area dong-punggi" onclick="myAlert('현재 선택된 풍기동 구역입니다!')">
      <div class="dong-title">풍기동</div>
      <div class="active-pin">📍</div>
    </div>
    
    <button class="plant-btn" onclick="plantSeed()">여기에 오이 심기 🌱</button>
  </div>
  
  <div class="bottom-nav">
    <div class="nav-item nav-active" onclick="myAlert('현재 오이밭(지도) 화면입니다!')"><span class="nav-icon">📍</span>오이밭</div>
    <div class="nav-item" onclick="myAlert('동네생활 커뮤니티 게시판으로 이동합니다!')"><span class="nav-icon">🏘️</span>동네생활</div>
    <div class="nav-item" onclick="myAlert('이웃들과의 채팅창이 열립니다!')"><span class="nav-icon">💬</span>채팅</div>
    <div class="nav-item" onclick="myAlert('내 지갑(포인트/쿠폰) 화면으로 이동합니다!')"><span class="nav-icon">💰</span>지갑</div>
    <div class="nav-item" onclick="myAlert('B2B 기업용 대시보드 및 마이페이지!')"><span class="nav-icon">🏢</span>B2B</div>
  </div>
</body>
</html>
