<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오이(Oi) - 리얼 지도 오이밭</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .header { background: #fff; padding: 15px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    #real-map { flex: 1; width: 100%; z-index: 1; }
    .plant-btn { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 85%; max-width: 350px; padding: 18px; border-radius: 30px; font-weight: bold; font-size: 18px; border: none; background: #4caf50; color: #fff; cursor: pointer; box-shadow: 0 8px 15px rgba(76,175,80,0.5); z-index: 1000; }
    .bottom-nav { width: 100%; display: flex; background: #fff; padding: 10px 0; border-top: 1px solid #eee; z-index: 1000; padding-bottom: 20px; }
    .nav-item { flex: 1; text-align: center; font-size: 12px; color: #aaa; font-weight: bold; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
    .nav-active { color: #4caf50; }
    .nav-icon { font-size: 24px; }
  </style>
</head>
<body>
  <div class="header">
    <span>📍 아산시 (리얼 지도)</span>
    <span style="font-size: 20px;" onclick="myAlert('검색 및 알림 기능 준비 중!')">🔍 🔔</span>
  </div>
  
  <div id="real-map"></div>
  
  <button class="plant-btn" onclick="plantSeed()">여기에 오이 심기 🌱</button>
  
  <div class="bottom-nav">
    <div class="nav-item nav-active" onclick="myAlert('현재 오이밭(지도) 화면입니다!')"><span class="nav-icon">📍</span>오이밭</div>
    <div class="nav-item" onclick="myAlert('동네생활 커뮤니티 게시판으로 이동합니다!')"><span class="nav-icon">🏘️</span>동네생활</div>
    <div class="nav-item" onclick="myAlert('이웃들과의 채팅창이 열립니다!')"><span class="nav-icon">💬</span>채팅</div>
    <div class="nav-item" onclick="myAlert('내 지갑(포인트/쿠폰) 화면으로 이동합니다!')"><span class="nav-icon">💰</span>지갑</div>
    <div class="nav-item" onclick="myAlert('B2B 기업용 대시보드 및 마이페이지!')"><span class="nav-icon">🏢</span>B2B</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function myAlert(msg) {
      alert(msg);
    }
    
    var map = L.map('real-map', { zoomControl: false }).setView([36.7836, 127.0041], 14);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    var cucumberIcon = L.divIcon({
      className: 'custom-icon',
      html: "<div style='font-size:35px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));'>🥒</div>",
      iconSize: [35, 35],
      iconAnchor: [17, 35]
    });

    L.marker([36.7836, 127.0041], {icon: cucumberIcon}).addTo(map)
      .bindPopup("<b style='color:#4caf50;'>여기가 바로 오이 1호점 예정지!</b>")
      .openPopup();

    function plantSeed() {
      myAlert('🌱 지도 중앙에 씨앗을 심습니다!\n\n(곧 4번 브랜드 선택 팝업창으로 연결됩니다!)');
    }
  </script>
</body>
</html>
