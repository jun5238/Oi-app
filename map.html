<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - 리얼 성장 카카오지도</title>
  <style>
    * { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none !important; }
    
    body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; background: #fff; overflow: hidden; width: 100vw; height: 100vh; }
    
    /* 🚨 지도 투명 망토 방지: 화면 크기 깡패처럼 고정!! */
    #map-wrapper { position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 75px); z-index: 1; pointer-events: auto; }
    #real-map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #f4f4f4; }
    
    .floating-top { position: absolute; top: 15px; left: 0; width: 100%; z-index: 1000; padding: 0 15px; box-sizing: border-box; pointer-events: none; }
    .search-bar { background: #fff; border-radius: 5px; padding: 12px 15px; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 1px solid #eee; pointer-events: auto; cursor: pointer; }
    .search-text { color: #888; font-size: 15px; font-weight: bold; pointer-events: none; }

    .brand-pin { display: flex; justify-content: center; align-items: flex-end; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); pointer-events: auto; cursor: pointer; }

    .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: #fff; border-radius: 25px 25px 0 0; padding: 25px 20px; box-sizing: border-box; z-index: 3000; box-shadow: 0 -10px 25px rgba(0,0,0,0.1); display: none; pointer-events: auto; }
    .sheet-handle { width: 40px; height: 5px; background: #ddd; border-radius: 3px; margin: 0 auto 20px; }
    .sheet-title { font-size: 22px; font-weight: bold; text-align: center; margin: 0 0 10px 0; color: #111; pointer-events: none; }
    .sheet-info { text-align: center; font-size: 14px; font-weight: bold; color: #555; margin-bottom: 25px; pointer-events: none; }
    .point-color { color: #4caf50; }

    .timeline-container { display: flex; justify-content: space-between; align-items: center; position: relative; margin-bottom: 30px; padding: 0 5px; pointer-events: none; }
    .timeline-line { position: absolute; top: 30px; left: 30px; right: 30px; height: 4px; background: #eee; z-index: 1; }
    .timeline-line-fill { position: absolute; top: 0; left: 0; height: 100%; background: #4caf50; width: 0%; transition: width 0.5s; }
    
    .timeline-step { display: flex; flex-direction: column; align-items: center; z-index: 2; position: relative; }
    .step-circle { width: 60px; height: 60px; background: #fff; border: 3px solid #eee; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; transition: all 0.3s; }
    .step-active .step-circle { border-color: #4caf50; box-shadow: 0 0 15px rgba(76,175,80,0.4); transform: scale(1.15); }
    .step-done .step-circle { border-color: #4caf50; background: #e8f5e9; }
    .step-label { font-size: 12px; font-weight: bold; color: #999; margin-top: 10px; }
    .step-active .step-label { color: #4caf50; }

    .plant-btn { width: 100%; height: 60px; border-radius: 12px; font-weight: bold; font-size: 20px; border: none; background: #4caf50; color: #fff; cursor: pointer; box-shadow: 0 5px 15px rgba(76,175,80,0.4); pointer-events: auto; }
    .plant-btn:active { transform: scale(0.98); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; background: #fff; padding: 0; border-top: 1px solid #eee; z-index: 9999; height: 75px; box-sizing: border-box; }
    .nav-item { flex: 1; text-align: center; color: #aaa; font-weight: bold; text-decoration: none; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; height: 100%; pointer-events: auto; }
    .nav-active { color: #333; }
    .nav-icon { font-size: 24px; line-height: 1.2; }
    .nav-text { font-size: 11px; margin-top: 4px; pointer-events: none; }
  </style>
</head>
<body>
  
  <div id="map-wrapper">
    <div class="floating-top">
      <div class="search-bar" onclick="location.reload();">
        <div class="search-text">지도를 터치해서 심어보세요! (안 보이면 터치🔄)</div>
      </div>
    </div>
    
    <div id="real-map"></div>
    
    <div class="bottom-sheet" id="water-sheet">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="stage-name">내 오이 키우기 🌱</h2>
      <div class="sheet-info">다음 성장까지 물 <span class="point-color" id="need-water">3</span>번 필요</div>
      
      <div class="timeline-container">
        <div class="timeline-line">
          <div class="timeline-line-fill" id="timeline-fill"></div>
        </div>
        <div class="timeline-step step-active" id="step-0"><div class="step-circle">🌱</div><div class="step-label">새싹</div></div>
        <div class="timeline-step" id="step-1"><div class="step-circle">🌿</div><div class="step-label">줄기</div></div>
        <div class="timeline-step" id="step-2"><div class="step-circle">🌼</div><div class="step-label">꽃</div></div>
        <div class="timeline-step" id="step-3"><div class="step-circle">🥒</div><div class="step-label">애기오이</div></div>
        <div class="timeline-step" id="step-4"><div class="step-circle">🥒✨</div><div class="step-label">성인오이</div></div>
      </div>
      <button class="plant-btn" onclick="giveWater()">오이 물주기 💦</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='home.html'"><span class="nav-icon">🏠</span><span class="nav-text">홈</span></div>
    <div class="nav-item" onclick="myAlert('커뮤니티 준비 중!')"><span class="nav-icon">🏘️</span><span class="nav-text">커뮤니티</span></div>
    <div class="nav-item nav-active" onclick="location.href='map.html'"><span class="nav-icon">📍</span><span class="nav-text">동네지도</span></div>
    <div class="nav-item" onclick="myAlert('채팅창 준비 중!')"><span class="nav-icon">💬</span><span class="nav-text">채팅</span></div>
    <div class="nav-item" onclick="location.href='b2b.html'"><span class="nav-icon">👤</span><span class="nav-text">마이</span></div>
  </div>

  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cabaf8ffe846f234421d25cc947dea15"></script>
  <script>
    function myAlert(msg) { alert(msg); }
    
    var map;
    var currentOverlay = null;
    var waterCount = 0;
    var currentStage = 0;
    var currentLatLng = null;

    var stages = [
      { icon: '🌱', max: 3, boxSize: 60, fontSize: 60 },
      { icon: '🌿', max: 7, boxSize: 85, fontSize: 85 },
      { icon: '🌼', max: 12, boxSize: 110, fontSize: 110 },
      { icon: '🥒', max: 20, boxSize: 135, fontSize: 135 },
      { icon: '🥒✨', max: 30, boxSize: 170, fontSize: 170 }
    ];

    // 지도 초기화 함수
    function initMap() {
      var mapContainer = document.getElementById('real-map');
      var mapOption = { 
          center: new kakao.maps.LatLng(36.7766, 127.0229), 
          level: 4 // 동네가 더 잘 보이게 살짝 넓게 잡았습니다!
      };
      map = new kakao.maps.Map(mapContainer, mapOption);

      kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        if (currentOverlay) { currentOverlay.setMap(null); }
        waterCount = 0; currentStage = 0; currentLatLng = mouseEvent.latLng;
        drawMarker(); showSheet();
      });

      // 0.3초 뒤에 지도를 한 번 더 흔들어 깨워서 크기를 강제로 맞춥니다!
      setTimeout(function() {
        map.relayout();
        map.setCenter(new kakao.maps.LatLng(36.7766, 127.0229));
      }, 300);
    }

    // 화면이 켜지면 지도 실행!
    window.onload = function() {
      if (typeof kakao !== 'undefined' && kakao.maps) {
        kakao.maps.load(initMap);
      } else {
        setTimeout(function() {
          if (typeof kakao !== 'undefined' && kakao.maps) { kakao.maps.load(initMap); }
        }, 500);
      }
    };

    function drawMarker() {
      if (currentOverlay) currentOverlay.setMap(null);
      var s = stages[currentStage];
      var content = document.createElement('div');
      content.className = 'brand-pin';
      content.style.width = s.boxSize + 'px';
      content.style.height = s.boxSize + 'px';
      content.style.fontSize = s.fontSize + 'px';
      content.innerHTML = s.icon;
      content.onclick = function() { showSheet(); };
      currentOverlay = new kakao.maps.CustomOverlay({
        position: currentLatLng, content: content, yAnchor: 1, zIndex: 3
      });
      currentOverlay.setMap(map);
    }

    function showSheet() { document.getElementById('water-sheet').style.display = 'block'; updateUI(); }

    function giveWater() {
      if (currentStage >= stages.length - 1 && waterCount >= stages[currentStage].max) {
        myAlert('🎉 완벽하게 다 자란 성인 오이입니다!! 수확하세요!!'); return;
      }
      waterCount++;
      var s = stages[currentStage];
      if (waterCount >= s.max && currentStage < stages.length - 1) {
        currentStage++; myAlert('🌟 오이가 다음 단계로 폭풍 성장했습니다!!'); drawMarker();
      } else {
        myAlert('💦 물을 주었습니다! 쑥쑥 자라라!!');
      }
      updateUI();
    }

    function updateUI() {
      var stageInfo = stages[currentStage];
      document.getElementById('stage-name').innerText = '내 오이 키우기 ' + stageInfo.icon;
      var remain = stageInfo.max - waterCount;
      if (remain < 0) remain = 0;
      document.getElementById('need-water').innerText = remain;
      for(var i = 0; i < 5; i++) {
        var el = document.getElementById('step-' + i);
        el.className = 'timeline-step';
        if(i < currentStage) el.className = 'timeline-step step-done';
        if(i === currentStage) el.className = 'timeline-step step-active';
      }
      var fillPercent = (currentStage / 4) * 100;
      document.getElementById('timeline-fill').style.width = fillPercent + '%';
    }
  </script>
</body>
</html>
