<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - 심플 오이밭</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    
    #map-wrapper { flex: 1; position: relative; width: 100%; }
    #real-map { width: 100%; height: 100%; z-index: 1; }
    
    .floating-top { position: absolute; top: 15px; left: 0; width: 100%; z-index: 1000; padding: 0 15px; box-sizing: border-box; }
    
    .search-bar { background: #fff; border-radius: 25px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 3px 10px rgba(0,0,0,0.1); margin-bottom: 10px; }
    .search-text { color: #888; font-size: 16px; font-weight: bold; }
    .profile-icon { width: 30px; height: 30px; background: #eee; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; color: #aaa; }
    
    .filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-chip { background: #fff; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.08); white-space: nowrap; border: 1px solid #eee; }
    
    .side-btn-group { position: absolute; bottom: 120px; left: 15px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .circle-btn { width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 20px; cursor: pointer; }
    
    .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: #fff; border-radius: 20px 20px 0 0; padding: 25px 20px; box-sizing: border-box; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
    .sheet-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin-top: -10px; margin-bottom: 20px; }
    
    .plant-btn { width: 100%; max-width: 350px; padding: 18px; border-radius: 12px; font-weight: bold; font-size: 18px; border: none; background: #4caf50; color: #fff; cursor: pointer; }
    
    .bottom-nav { width: 100%; display: flex; background: #fff; padding: 10px 0; border-top: 1px solid #eee; z-index: 2000; padding-bottom: 20px; }
    .nav-item { flex: 1; text-align: center; font-size: 11px; color: #aaa; font-weight: bold; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
    .nav-active { color: #333; }
    .nav-icon { font-size: 22px; filter: grayscale(100%); opacity: 0.6; }
    .nav-active .nav-icon { filter: none; opacity: 1; }
  </style>
</head>
<body>
  
  <div id="map-wrapper">
    <div class="floating-top">
      <div class="search-bar" onclick="myAlert('풍기동 검색창이 열립니다!')">
        <div class="search-text">🔍 풍기동 주변 핫플 검색</div>
        <div class="profile-icon">👤</div>
      </div>
      <div class="filter-scroll">
        <div class="filter-chip">🌱 대왕오이 임박</div>
        <div class="filter-chip">☕ 카페/디저트</div>
        <div class="filter-chip">🍔 패스트푸드</div>
        <div class="filter-chip">🎉 신규 오픈</div>
      </div>
    </div>
    
    <div id="real-map"></div>
    
    <div class="side-btn-group">
      <div class="circle-btn" onclick="myAlert('내 위치로 이동합니다!')">🎯</div>
      <div class="circle-btn" onclick="myAlert('동네 홈으로 이동합니다!')">🏠</div>
    </div>
    
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div style="width: 100%; display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
        <div style="font-size: 40px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">🥒</div>
        <div>
          <div style="font-weight: bold; font-size: 16px; color: #333;">여기에 브랜드 씨앗 심기</div>
          <div style="font-size: 13px; color: #777;">이웃들과 함께 물을 주고 오픈시켜봐요!</div>
        </div>
      </div>
      <button class="plant-btn" onclick="plantSeed()">씨앗 심기 팝업 열기 🌱</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">🏠</span>홈</div>
    <div class="nav-item" onclick="location.href='community.html'"><span class="nav-icon">🏘️</span>커뮤니티</div>
    <div class="nav-item nav-active" onclick="myAlert('현재 오이밭(지도) 화면입니다!')"><span class="nav-icon">📍</span>동네지도</div>
    <div class="nav-item" onclick="myAlert('채팅창이 열립니다!')"><span class="nav-icon">💬</span>채팅</div>
    <div class="nav-item" onclick="myAlert('마이페이지!')"><span class="nav-icon">👤</span>나의 오이</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function myAlert(msg) {
      alert(msg);
    }
    
    var map = L.map('real-map', { zoomControl: false, attributionControl: false }).setView([36.7836, 127.0041], 15);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);

    var cucumberIcon = L.divIcon({
      className: 'custom-icon',
      html: "<div style='background:#fff; border-radius:50%; width:40px; height:40px; display:flex; justify-content:center; align-items:center; font-size:25px; box-shadow:0 3px 6px rgba(0,0,0,0.2); border:2px solid #4caf50;'>🥒</div>",
      iconSize: [44, 44],
      iconAnchor: [22, 22]
    });

    L.marker([36.7836, 127.0041], {icon: cucumberIcon}).addTo(map);
    L.marker([36.7860, 127.0010], {icon: L.divIcon({className: 'custom-icon', html: "<div style='background:#fff; border-radius:50%; width:40px; height:40px; display:flex; justify-content:center; align-items:center; font-size:25px; box-shadow:0 3px 6px rgba(0,0,0,0.2);'>☕</div>", iconSize: [40,40]})}).addTo(map);

    function plantSeed() {
      myAlert('🌱 4번 브랜드 선택 팝업창이 올라옵니다!!');
    }
  </script>
</body>
</html>
