<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오이(Oi) - 로고 대변신!</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4caf50">
  <link rel="apple-touch-icon" href="main.png"> <link rel="icon" href="main.png"> <style>
    body { margin: 0; padding: 0; background: #fff; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    .logo-img { width: 150px; height: 150px; object-fit: contain; margin-bottom: 20px; border-radius: 35px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .brand-name { font-size: 50px; font-weight: bold; color: #222; margin-bottom: 5px; }
    .btn-kakao { width: 85%; max-width: 350px; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 18px; border: none; background: #FEE500; cursor: pointer; }
  </style>
  <script>
    function myAlert(msg) { alert(msg); }
    function startApp() { window.location.href = 'region.html'; }
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; myAlert('🥒 오이(Oi)를 바탕화면에 설치해서 즐겨보세요!'); });
  </script>
</head>
<body>
  <img src="main.png" alt="오이 로고" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2347/2347031.png'">
  <div class="brand-name">Oi</div>
  <div style="font-size: 20px; font-weight: bold; margin-bottom: 50px; color: #4caf50;">오픈해줘 이곳에</div>
  <button class="btn-kakao" onclick="startApp()">🟡 카카오로 시작하기</button>
</body>
</html>
