<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - 시작하기</title>
  <style>
    * { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none !important; box-sizing: border-box; }
    
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; background: #fff; 
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      background-image: url('logo.png');
      background-repeat: no-repeat; background-position: center 30%; background-size: 130px;
      overflow: hidden;
    }
    
    .logo-box { display: none; }
    
    .content-area { width: 100%; padding: 0 15px 50px 15px; text-align: center; z-index: 10; }
    
    .title { font-size: 50px; font-weight: bold; color: #111; margin-bottom: 20px; letter-spacing: -2px; }
    
    .subtitle { font-size: 20px; font-weight: bold; color: #555; margin-bottom: 50px; letter-spacing: -1px; display: flex; align-items: center; justify-content: center; gap: 5px; }
    
    .img-char { display: inline-block; height: 50px; background-image: url('oi-font.png'); background-repeat: no-repeat; background-size: 200% 100%; vertical-align: middle; }
    .img-o { width: 50px; background-position: left center; }
    .img-i { width: 50px; background-position: right center; }
    
    .input-group { width: 100%; max-width: 350px; margin-bottom: 12px; display: inline-block; text-align: left; }
    .input-field { width: 100%; padding: 18px 20px; border-radius: 15px; border: 1px solid #e0e0e0; font-size: 15px; background: rgba(250, 250, 250, 0.95); transition: 0.3s; font-family: 'Malgun Gothic', sans-serif; backdrop-filter: blur(5px); }
    .input-field:focus { border-color: #4caf50; background: #fff; box-shadow: 0 0 0 3px rgba(76,175,80,0.15); }
    
    .login-btn { width: 100%; max-width: 350px; padding: 18px; border-radius: 15px; background: #4caf50; color: #fff; font-size: 18px; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; box-shadow: 0 6px 15px rgba(76,175,80,0.3); transition: 0.2s; pointer-events: auto; }
    .login-btn:active { transform: scale(0.97); }
    
    .signup-link { margin-top: 30px; font-size: 14px; color: #888; pointer-events: auto; cursor: pointer; display: block; }
    .signup-link span { color: #4caf50; font-weight: bold; margin-left: 5px; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="content-area">
    <div class="title">Oi</div>
    
    <div class="subtitle">
      <span class="img-char img-o"></span>
      <span>픈해줘 이곳에</span>
      <span class="img-char img-i"></span>
    </div>
    
    <div class="input-group">
      <input type="email" class="input-field" id="email" placeholder="이메일 주소" autocomplete="off">
    </div>
    <div class="input-group">
      <input type="password" class="input-field" id="pw" placeholder="비밀번호">
    </div>
    
    <button class="login-btn" onclick="handleLogin()">로그인</button>
    
    <div class="signup-link" onclick="myAlert('회원가입 페이지는 열심히 준비 중입니다!')">아직 계정이 없으신가요? <span>회원가입</span></div>
  </div>

  <script>
    function myAlert(msg) { alert(msg); }
    
    function handleLogin() {
      var email = document.getElementById('email').value;
      var pw = document.getElementById('pw').value;
      
      if(email === '' || pw === '') {
        myAlert('이메일과 비밀번호를 모두 입력해주세요!');
        return;
      }
      
      location.href = 'home.html';
    }
  </script>
</body>
</html>
