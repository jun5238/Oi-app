<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - 로그인</title>
  <style>
    * { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; outline: none !important; box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fcfdfc; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 100vh;
    }

    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 🚨 마법의 카멜레온 입력창 */
    .clear-input {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 6.5%; 
      background: transparent; /* 처음엔 투명해서 그림 글씨가 보임! */
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #111;
      padding: 0 15px;
      font-family: 'Malgun Gothic', sans-serif;
      pointer-events: auto;
      z-index: 10;
    }

    /* 🚨 둔갑술 발동!! (터치하거나 글씨가 써져 있으면 불투명해져서 뒤를 가림!) */
    .clear-input:focus,
    .clear-input:valid {
      background: #f6faf6; /* 배경 그림 안쪽과 비슷한 아주 연한 녹색으로 덮어버림! */
      box-shadow: 0 0 5px rgba(0,0,0,0.05); /* 살짝 그림자 줘서 자연스럽게 */
    }

    #email { top: 52%; } 
    #pw { top: 61%; } 

    .clear-btn { position: absolute; left: 10%; top: 69.5%; width: 80%; height: 7%; background: transparent; border: none; cursor: pointer; pointer-events: auto; z-index: 10; }
    .clear-signup { position: absolute; left: 60%; top: 78%; width: 30%; height: 4%; background: transparent; cursor: pointer; pointer-events: auto; z-index: 10; }
    .nav-area { position: absolute; bottom: 0; left: 0; width: 100%; height: 10%; display: flex; z-index: 10; }
    .nav-item { flex: 1; height: 100%; cursor: pointer; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="app-container">
    <img src="bg.png" class="bg-img">

    <input type="email" id="email" class="clear-input" required>
    <input type="password" id="pw" class="clear-input" required>

    <button class="clear-btn" onclick="handleLogin()"></button>
    <div class="clear-signup" onclick="myAlert('회원가입 준비 중!')"></div>

    <div class="nav-area">
      <div class="nav-item" onclick="location.href='home.html'"></div>
      <div class="nav-item" onclick="myAlert('준비 중!')"></div>
      <div class="nav-item" onclick="location.href='map.html'"></div>
      <div class="nav-item" onclick="myAlert('준비 중!')"></div>
      <div class="nav-item" onclick="location.href='b2b.html'"></div>
    </div>
  </div>

  <script>
    function myAlert(msg) { alert(msg); }
    function handleLogin() {
      var email = document.getElementById('email').value;
      var pw = document.getElementById('pw').value;
      if(email === '' || pw === '') {
        myAlert('이메일과 비밀번호를 모두 입력해주세요! 🥒');
        return;
      }
      location.href = 'home.html';
    }
  </script>
</body>
</html>
