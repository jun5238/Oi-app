<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오이(Oi) - 오! 오픈해줘 이곳에!</title>
  <style>
    body { margin: 0; padding: 0; background-color: #ffffff; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .logo { font-size: 100px; margin-bottom: 10px; filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.1)); }
    .title { font-size: 40px; font-weight: bold; color: #333; margin-bottom: 5px; }
    .slogan { font-size: 22px; font-weight: bold; margin-bottom: 60px; color: #333; }
    .highlight { color: #4caf50; font-size: 26px; }
    .btn { width: 85%; max-width: 350px; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 18px; border: none; cursor: pointer; margin-bottom: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-kakao { background: #FEE500; color: #000; }
    .link { font-size: 14px; color: #999; text-decoration: underline; cursor: pointer; padding: 10px; }
  </style>
</head>
<body>
  <div class="logo">🥒</div>
  <div class="title">Oi</div>
  <div class="slogan">
    <span class="highlight">오</span>(픈해줘) <span class="highlight">이</span>(곳에)
  </div>
  <button class="btn btn-kakao" onclick="alert('🟡 카카오 로그인 페이지로 슝! 이동합니다!')">카카오로 3초 만에 시작하기</button>
  <div class="link" onclick="alert('✉️ 이메일 로그인 창이 열립니다!')">이메일로 회원가입 / 로그인</div>
</body>
</html>
