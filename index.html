<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - 로그인</title>
  <style>
    * { -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; outline: none !important; box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fcfdfc; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 500px; /* 폰 화면 비율 유지 */
      height: 100vh;
    }

    /* 1. 배경 이미지를 꽉 차게 깝니다 */
    .bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 2. 마법의 '투명 유리판' 입력창 설정 */
    .clear-input {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 6.5%; 
      background: transparent; /* 🚨 배경 완전 투명! (하얀 박스 박멸!) */
      border: none;            /* 🚨 테두리 완전 투명! */
      font-size: 16px;
      font-weight: bold;
      color: #111;             /* 사용자가 치는 글씨는 까맣게 잘 보이게! */
      padding: 0 15px;
      font-family: 'Malgun Gothic', sans-serif;
      pointer-events: auto;    /* 터치 가능하게! */
      z-index: 10;
    }

    /* 이미지 비율에 맞춰서 투명 유리판 위치만 잡아줍니다 */
    #email { top: 52%; } /* 이메일 입력창 위치 */
    #pw { top: 61%; }    /* 비밀번호 입력창 위치 */

    /* 투명 로그인 버튼 (그림 위 버튼 자리에 투명하게 덮음) */
    .clear-btn {
      position: absolute;
      left: 10%; top: 69.5%; width: 80%; height: 7%;
      background: transparent; border: none;
      cursor: pointer; pointer-events: auto; z-index: 10;
    }

    /* 투명 회원가입 버튼 (그림 위 회원가입 글씨 자리에 덮음) */
    .clear-signup {
      position: absolute;
      left: 60%; top: 78%; width: 30%; height: 4%;
      background: transparent; cursor: pointer; pointer-events: auto; z-index: 10;
    }

    /* 하단 메뉴 투명 버튼들 (그림 위 하단 아이콘 5개 자리에 덮음) */
    .nav-area { position: absolute; bottom: 0; left: 0; width: 100%; height: 10%; display: flex; z-index: 10; }
    .nav-item { flex: 1; height: 100%; cursor: pointer; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="app-container">
    
    <img src="bg.png" class="bg-img">

    <input type="email" id="email" class="clear-input">
    <input type="password" id="pw" class="clear-input">

    <button class="clear-btn" onclick="handleLogin()"></button>
    <div class="clear-signup" onclick="myAlert('회원가입 준비 중!')"></div>

    <div class="nav-area">
      <div class="nav-item" onclick="location.href='home.html'"></div>
      <div class="nav-item" onclick="myAlert('준비 중!')"></div>
      <div class="nav-item" onclick="location.href='map.html'"></div>
      <div class="nav-item" onclick="myAlert('준비 중!')"></div>
      <div class="nav-item" onclick="location.href='b2b.html'"></div>
    </div>
  </div>

  <script>
    function myAlert(msg) { alert(msg); }
    function handleLogin() {
      var email = document.getElementById('email').value;
      var pw = document.getElementById('pw').value;
      if(email === '' || pw === '') {
        myAlert('이메일과 비밀번호를 모두 입력해주세요! 🥒');
        return;
      }
      location.href = 'home.html';
    }
  </script>
</body>
</html>
