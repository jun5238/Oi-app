<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오이(Oi) - 지갑/마이</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; background: #f8f9fa; padding-bottom: 90px; }
    .container { padding: 20px; }
    
    .point-card { background: #4caf50; border-radius: 20px; padding: 25px 20px; color: #fff; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(76,175,80,0.2); }
    .point-title { font-size: 14px; margin-bottom: 10px; opacity: 0.9; }
    .point-amount { font-size: 36px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; }
    .point-link { font-size: 12px; text-decoration: underline; opacity: 0.8; cursor: pointer; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .section-title { font-size: 18px; font-weight: bold; color: #111; }
    .section-more { font-size: 13px; color: #4caf50; cursor: pointer; }

    .coupon-card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); position: relative; overflow: hidden; }
    .coupon-border-orange { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #ff9800; }
    .coupon-border-blue { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #2196f3; }
    
    .coupon-icon { font-size: 30px; margin-right: 15px; margin-left: 10px; }
    .coupon-info { flex: 1; }
    .coupon-brand { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 5px; }
    .coupon-desc { font-size: 13px; color: #777; }
    
    .btn-use { padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; background: #fff; cursor: pointer; }
    .btn-orange { border: 1px solid #ff9800; color: #ff9800; }
    .btn-blue-outline { border: 1px solid #2196f3; color: #2196f3; }

    .bottom-nav { width: 100%; display: flex; background: #fff; padding: 10px 0; border-top: 1px solid #eee; position: fixed; bottom: 0; left: 0; z-index: 4000; height: 75px; box-sizing: border-box; }
    .nav-item { flex: 1; text-align: center; font-size: 11px; color: #aaa; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; }
    .nav-active { color: #333; }
    .nav-icon { font-size: 24px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="point-card">
      <div class="point-title">나의 보유 오이 포인트</div>
      <div class="point-amount">🥒 12,500 P</div>
      <div class="point-link" onclick="myAlert('사용처 페이지로 이동합니다!')">포인트 사용처 확인하기 ></div>
    </div>

    <div class="section-header">
      <div class="section-title">보유 쿠폰 (2)</div>
      <div class="section-more" onclick="myAlert('전체 쿠폰을 확인합니다!')">전체보기 ></div>
    </div>

    <div class="coupon-card">
      <div class="coupon-border-orange"></div>
      <div class="coupon-icon">☕</div>
      <div class="coupon-info">
        <div class="coupon-brand">컴포즈커피 풍기점</div>
        <div class="coupon-desc">아메리카노 1잔 무료 쿠폰</div>
      </div>
      <button class="btn-use btn-orange" onclick="myAlert('바코드를 직원에게 보여주세요!')">사용하기</button>
    </div>

    <div class="coupon-card">
      <div class="coupon-border-blue"></div>
      <div class="coupon-icon">🌯</div>
      <div class="coupon-info">
        <div class="coupon-brand">서브웨이 아산터미널점</div>
        <div class="coupon-desc">에그마요 15cm 20% 할인권</div>
      </div>
      <button class="btn-use btn-blue-outline" onclick="myAlert('바코드를 직원에게 보여주세요!')">사용하기</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">🏠</span>홈</div>
    <div class="nav-item" onclick="myAlert('커뮤니티 준비 중!')"><span class="nav-icon">🏘️</span>커뮤니티</div>
    <div class="nav-item" onclick="location.href='map.html'"><span class="nav-icon">📍</span>동네지도</div>
    <div class="nav-item" onclick="myAlert('채팅창 준비 중!')"><span class="nav-icon">💬</span>채팅</div>
    <div class="nav-item nav-active" onclick="location.href='my.html'"><span class="nav-icon">👤</span>마이</div>
  </div>

  <script>
    function myAlert(msg) { alert(msg); }
  </script>
</body>
</html>
