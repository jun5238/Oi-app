<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오이(Oi) - 물주기</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f6f9; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; }
    .header { width: 100%; background: #fff; padding: 15px; border-bottom: 1px solid #eee; text-align: center; font-weight: bold; }
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px; }
    .seed-img { font-size: 100px; margin-bottom: 20px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .gauge-bg { width: 300px; height: 20px; background: #eee; border-radius: 10px; overflow: hidden; margin: 20px 0; }
    .gauge-fill { width: 65%; height: 100%; background: #4caf50; transition: 0.5s; }
    .water-btn { width: 250px; padding: 20px; border-radius: 15px; background: #2196f3; color: #fff; border: none; font-size: 20px; font-weight: bold; box-shadow: 0 5px 15px rgba(33,150,243,0.3); }
  </style>
  <script>
    function myAlert(msg) { alert(msg); }
    function giveWater() {
      document.querySelector('.gauge-fill').style.width = '80%';
      myAlert('💦 물을 주었습니다! 쑥쑥 자라라!!');
    }
    function goBack() { window.location.href = 'map.html'; } // 🧠 지도로 돌아가도 씨앗이 남아있게 됨!
  </script>
</head>
<body>
  <div class="header">🌱 오이 물주기</div>
  <div class="content">
    <div class="seed-img">🥒</div>
    <div style="font-size: 20px; font-weight: bold;">방금 심은 오이</div>
    <div class="gauge-bg"><div class="gauge-fill"></div></div>
    <button class="water-btn" onclick="giveWater()">물주기 💦</button>
    <button onclick="goBack()" style="margin-top: 20px; background: none; border: none; color: #999; text-decoration: underline;">지도로 돌아가기</button>
  </div>
</body>
</html>
